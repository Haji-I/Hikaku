  </div>

  <main id="view"></main>

  <div id="mini" data-action="np-open" hidden>
    <div class="mini-cv" id="mini-cv"></div>
    <div class="meta">
      <div class="t1" id="mini-title"></div>
      <div class="t2" id="mini-sub"></div>
    </div>
    <button class="ib" data-action="toggle" id="mini-play" aria-label="Lecture/Pause"></button>
    <button class="ib" data-action="next" aria-label="Suivant"><svg class="i"><use href="#i-next"/></svg></button>
    <div class="prog"><i id="mini-prog"></i></div>
  </div>

  <nav id="tabbar">
    <a href="#/home" data-tab="home"><svg class="i"><use href="#i-home"/></svg><span>Accueil</span></a>
    <a href="#/search" data-tab="search"><svg class="i"><use href="#i-search"/></svg><span>Recherche</span></a>
    <a href="#/library" data-tab="library"><svg class="i"><use href="#i-library"/></svg><span>Bibliothèque</span></a>
    <a href="#/radio" data-tab="radio"><svg class="i"><use href="#i-radio"/></svg><span>Radio</span></a>
  </nav>

  <section id="np" aria-label="Lecture en cours">
    <div class="np-bg"><img id="np-bg" alt=""></div>
    <header class="np-head" id="np-drag">
      <button class="ib" data-action="np-close" aria-label="Réduire"><svg class="i"><use href="#i-down"/></svg></button>
      <div class="np-src" id="np-src"></div>
      <button class="ib" data-action="np-menu" aria-label="Options"><svg class="i"><use href="#i-more"/></svg></button>
    </header>
    <div class="np-art" id="np-art"><div class="np-orb" id="np-orb"><div class="np-cover" id="np-cover"></div><div class="np-deco" aria-hidden="true"><span class="sfx sfx-1">ドドド</span><span class="sfx sfx-2">♪♪</span><span class="float">♡</span><span class="float">★</span><span class="float">♪</span><span class="float">♡</span><span class="float">✦</span></div></div></div>
    <div class="np-info">
      <div class="np-titles">
        <div class="np-title" id="np-title"></div>
        <button class="np-artist" id="np-artist" data-action="np-artist"></button>
      </div>
      <button class="ib" id="np-like" data-action="np-like" aria-label="J’aime"></button>
    </div>
    <div class="np-seek">
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Position">
      <div class="np-times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
    </div>
    <div class="np-live"><span class="dot"></span>EN DIRECT</div>
    <div class="np-ctrl">
      <button class="ib" id="b-shuffle" data-action="shuffle" aria-label="Aléatoire"><svg class="i"><use href="#i-shuffle"/></svg></button>
      <button class="ib lg" data-action="prev" aria-label="Précédent"><svg class="i"><use href="#i-prev"/></svg></button>
      <button class="big" id="b-play" data-action="toggle" aria-label="Lecture/Pause"></button>
      <button class="ib lg" data-action="next" aria-label="Suivant"><svg class="i"><use href="#i-next"/></svg></button>
      <button class="ib" id="b-repeat" data-action="repeat" aria-label="Répéter"></button>
    </div>
    <div class="np-tools">
      <button data-action="np-queue"><svg class="i"><use href="#i-queue"/></svg><span>À suivre</span></button>
      <button data-action="np-lyrics" class="no-radio"><svg class="i"><use href="#i-lyrics"/></svg><span>Paroles</span></button>
      <button data-action="sleep" id="b-sleep"><svg class="i"><use href="#i-timer"/></svg><span>Minuteur</span></button>
      <button data-action="speed" id="b-speed" class="no-radio"><svg class="i"><use href="#i-speed"/></svg><span>1×</span></button>
    </div>
    <div class="np-panel" id="np-panel">
      <div class="panel-head">
        <h3 id="panel-title"></h3>
        <button class="ib" data-action="panel-close" aria-label="Fermer"><svg class="i"><use href="#i-close"/></svg></button>
      </div>
      <div class="panel-body" id="panel-body"></div>
    </div>
  </section>

  <div id="overlay"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file-input" accept="audio/*,.mp3,.m4a,.aac,.wav" multiple hidden>
  <audio id="audio" preload="auto" playsinline></audio>

  <script type="module" src="js/app.js"></script>
</body>
